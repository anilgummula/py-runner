<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Catalog — Quick Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3A2E;
    --ink-2:#152A20;
    --cream:#F3ECD9;
    --cream-2:#EAE0C6;
    --brass:#B08D57;
    --brass-light:#D9BE8C;
    --rust:#9A4433;
    --charcoal:#2A2620;
    --muted:#5E7466;
    --line: rgba(42,38,32,0.10);
    --radius: 14px;
    --shadow: 0 10px 30px rgba(10,20,15,0.35), 0 2px 8px rgba(10,20,15,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(255,255,255,0.04), transparent 55%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    padding: 28px 20px 18px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--brass-light);
    opacity:0.85;
    margin:0 0 6px;
  }
  h1{
    font-family:'Special Elite', 'Courier New', monospace;
    font-weight:400;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 4px;
    letter-spacing:0.01em;
  }
  .sub{
    color: rgba(243,236,217,0.65);
    font-size:14px;
    margin:0 0 20px;
  }

  .search-wrap{
    position:relative;
    display:flex;
    align-items:center;
    background: rgba(243,236,217,0.06);
    border:1px solid rgba(243,236,217,0.14);
    border-radius: 10px;
    padding: 0 14px;
    transition: border-color .15s ease, background .15s ease;
  }
  .search-wrap:focus-within{
    border-color: var(--brass);
    background: rgba(243,236,217,0.09);
  }
  .search-wrap svg{ flex:0 0 auto; opacity:0.55; }
  #search{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--cream);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:12px 10px;
  }
  #search::placeholder{ color:rgba(243,236,217,0.4); }
  .count-pill{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    background:var(--cream);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* ---------- Grid ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding: 6px 20px 20px;
  }
  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap:16px;
  }

  @media (max-width: 480px){
    #grid{ grid-template-columns: 1fr; }
  }

  .card{
    position:relative;
    background:
      repeating-linear-gradient(180deg, transparent 0 33px, var(--line) 33px 34px),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    color:var(--charcoal);
    border-radius: var(--radius);
    padding: 34px 16px 14px;
    cursor:pointer;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.06);
    opacity:0;
    transform: translateY(10px);
    animation: rise .45s ease forwards;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: 0 14px 34px rgba(10,20,15,0.4), 0 3px 10px rgba(10,20,15,0.3); }
  .card:active{ transform: translateY(-1px) scale(0.99); }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .card, .fab, .modal-card{ transition:none !important; }
  }

  .punch{
    position:absolute;
    top:12px; right:12px;
    width:14px; height:14px;
    border-radius:50%;
    background: var(--ink);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.4), 0 0 0 2px var(--cream-2);
  }

  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .favicon{
    width:26px; height:26px;
    border-radius:6px;
    flex:0 0 auto;
    background: var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family:'Special Elite', monospace;
    font-size:13px;
    color:var(--cream);
    overflow:hidden;
  }
  .favicon img{ width:100%; height:100%; object-fit:cover; display:block; }

  .card-title{
    font-family:'Special Elite', 'Courier New', monospace;
    font-size:15.5px;
    line-height:1.25;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .card-url{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin: 0 0 16px;
  }

  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top: 1px dashed rgba(42,38,32,0.18);
    padding-top:10px;
  }
  .open-link{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    color: var(--rust);
    text-decoration:none;
  }
  .card-actions{ display:flex; gap:4px; }
  .icon-btn{
    width:30px; height:30px;
    border-radius:8px;
    border:none;
    background:transparent;
    color: var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background .12s ease, color .12s ease;
  }
  .icon-btn:hover{ background: rgba(42,38,32,0.08); color:var(--charcoal); }
  .icon-btn.danger:hover{ background: rgba(154,68,51,0.12); color:var(--rust); }

  /* ---------- Empty state ---------- */
  #empty{
    display:none;
    text-align:center;
    padding: 60px 20px;
    color: rgba(243,236,217,0.6);
  }
  #empty h2{
    font-family:'Special Elite', monospace;
    font-weight:400;
    color: var(--cream);
    font-size:20px;
    margin-bottom:6px;
  }
  #empty p{ font-size:14px; margin:0 0 18px; }
  #empty button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    background: var(--brass);
    color: var(--ink-2);
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width:58px; height:58px;
    border-radius:50%;
    background: var(--brass);
    color: var(--ink-2);
    border:none;
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    font-size:28px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:20;
    transition: transform .15s ease, background .15s ease;
  }
  .fab:hover{ background: var(--brass-light); transform: scale(1.05); }
  .fab:active{ transform: scale(0.95); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(10,15,12,0.6);
    backdrop-filter: blur(2px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{ display:flex; }
  .modal-card{
    width:100%;
    max-width:440px;
    background: var(--cream);
    color: var(--charcoal);
    border-radius: 18px 18px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    animation: sheet-up .28s ease forwards;
  }
  @keyframes sheet-up{ to{ transform: translateY(0); } }

  @media (min-width: 560px){
    .overlay{ align-items:center; }
    .modal-card{
      border-radius: var(--radius);
      transform: translateY(12px) scale(0.98);
      opacity:0;
      animation: modal-in .2s ease forwards;
    }
    @keyframes modal-in{ to{ transform:none; opacity:1; } }
  }

  .modal-tab{
    width:36px; height:5px;
    background: rgba(42,38,32,0.2);
    border-radius:3px;
    margin: 0 auto 16px;
  }
  @media (min-width:560px){ .modal-tab{ display:none; } }

  .modal-card h3{
    font-family:'Special Elite', monospace;
    font-weight:400;
    font-size:19px;
    margin:0 0 18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-family:'JetBrains Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid rgba(42,38,32,0.18);
    background: rgba(255,255,255,0.5);
    color:var(--charcoal);
    outline:none;
  }
  .field input:focus{ border-color:var(--brass); background:#fff; }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:10px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background: var(--ink); color: var(--cream); }
  .btn-primary:hover{ background: var(--ink-2); }
  .btn-ghost{ background: transparent; color: var(--muted); border:1px solid rgba(42,38,32,0.18); }
  .btn-ghost:hover{ background: rgba(42,38,32,0.06); }

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, .card:focus-visible{
    outline: 2px solid var(--brass-light);
    outline-offset: 2px;
  }

  /* toast */
  #toast{
    position:fixed;
    left:50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--cream);
    color: var(--charcoal);
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:10px;
    box-shadow: var(--shadow);
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index:40;
  }
  #toast.show{ opacity:1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Quick launch</p>
  <h1>Card Catalog</h1>
  <p class="sub">Your saved links, filed and ready to pull.</p>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="search" type="text" placeholder="Search your catalog…" autocomplete="off">
    <span class="count-pill" id="count">0</span>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div id="empty">
    <h2>The drawer's empty</h2>
    <p>File your first link to start your catalog.</p>
    <button id="emptyAdd">Add a card</button>
  </div>
</main>

<button class="fab" id="fabAdd" aria-label="Add a new card">+</button>

<div class="overlay" id="overlay">
  <div class="modal-card">
    <div class="modal-tab"></div>
    <h3 id="modalTitle">New card</h3>
    <form id="cardForm">
      <div class="field">
        <label for="titleInput">Title</label>
        <input id="titleInput" type="text" placeholder="e.g. Spring Boot Docs" required>
      </div>
      <div class="field">
        <label for="urlInput">URL</label>
        <input id="urlInput" type="text" placeholder="e.g. docs.spring.io" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save card</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'cardCatalog.links';
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty');
  const searchInput = document.getElementById('search');
  const countPill = document.getElementById('count');
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('cardForm');
  const titleInput = document.getElementById('titleInput');
  const urlInput = document.getElementById('urlInput');
  const modalTitle = document.getElementById('modalTitle');
  const saveBtn = document.getElementById('saveBtn');
  const toast = document.getElementById('toast');

  let links = loadLinks();
  let editingId = null;
  let toastTimer = null;

  function loadLinks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function saveLinks(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(links)); }
    catch(e){ showToast('Could not save — storage unavailable'); }
  }

  function normalizeUrl(raw){
    let v = raw.trim();
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function hostOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ return url; }
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = links.filter(l =>
      l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)
    );

    grid.innerHTML = '';
    countPill.textContent = links.length;

    if(links.length === 0){
      emptyState.style.display = 'block';
      grid.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    grid.style.display = 'grid';

    filtered.forEach((link, i) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.animationDelay = (i * 0.03) + 's';
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', 'Open ' + link.title);

      const host = hostOf(link.url);
      const initial = link.title.trim().charAt(0).toUpperCase() || '?';

      card.innerHTML = `
        <span class="punch"></span>
        <div class="card-head">
          <span class="favicon" data-initial="${initial}">
            <img src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}" alt="" loading="lazy">
          </span>
          <h3 class="card-title">${escapeHtml(link.title)}</h3>
        </div>
        <p class="card-url">${escapeHtml(host)}</p>
        <div class="card-foot">
          <a class="open-link" href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a>
          <div class="card-actions">
            <button class="icon-btn" data-action="edit" aria-label="Edit ${escapeAttr(link.title)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button class="icon-btn danger" data-action="delete" aria-label="Delete ${escapeAttr(link.title)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
            </button>
          </div>
        </div>
      `;

      const img = card.querySelector('.favicon img');
      img.addEventListener('error', () => {
        const fav = card.querySelector('.favicon');
        fav.removeChild(img);
        fav.textContent = initial;
      });

      card.addEventListener('click', (e) => {
        if(e.target.closest('[data-action]')) return;
        if(e.target.closest('.open-link')) return;
        window.open(link.url, '_blank', 'noopener,noreferrer');
      });
      card.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.target.closest('[data-action]')){
          window.open(link.url, '_blank', 'noopener,noreferrer');
        }
      });

      card.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
        e.stopPropagation();
        openModal(link);
      });
      card.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteLink(link.id);
      });

      grid.appendChild(card);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  function openModal(link){
    editingId = link ? link.id : null;
    modalTitle.textContent = link ? 'Edit card' : 'New card';
    saveBtn.textContent = link ? 'Save changes' : 'Save card';
    titleInput.value = link ? link.title : '';
    urlInput.value = link ? link.url : '';
    overlay.classList.add('open');
    setTimeout(() => titleInput.focus(), 50);
  }

  function closeModal(){
    overlay.classList.remove('open');
    form.reset();
    editingId = null;
  }

  function deleteLink(id){
    const link = links.find(l => l.id === id);
    links = links.filter(l => l.id !== id);
    saveLinks();
    render();
    showToast('Removed "' + (link ? link.title : 'card') + '"');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    const url = normalizeUrl(urlInput.value);
    if(!title || !urlInput.value.trim()) return;

    if(editingId){
      const link = links.find(l => l.id === editingId);
      link.title = title;
      link.url = url;
      showToast('Card updated');
    }else{
      links.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), title, url });
      showToast('Card filed');
    }
    saveLinks();
    render();
    closeModal();
  });

  document.getElementById('fabAdd').addEventListener('click', () => openModal(null));
  document.getElementById('emptyAdd').addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  searchInput.addEventListener('input', render);

  render();
})();
</script>

</body>
</html>
