<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>pyrun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.28.3/pyodide.js"></script>
<style>
  :root{
    --bg: #0c0d0a;
    --panel: #16170f;
    --panel-2: #1c1e14;
    --line: #2c2e1f;
    --amber: #d4ff5c;
    --amber-dim: #4c5a1e;
    --text: #e9e6d8;
    --text-dim: #7d7a63;
    --err: #ff6b5e;
    --ok: #8fd694;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', monospace;
    height:100%; overflow-x: hidden;
  }
  #app { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; position:relative; }

  header {
    display:flex; align-items:center; gap:12px;
    padding: 14px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top:0; z-index: 20;
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--line);
    color: var(--text); border-radius: 8px;
    width: 36px; height: 36px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size: 16px;
  }
  .icon-btn:active { transform: scale(0.94); }
  .brand-wrap { flex:1; min-width:0; }
  h1 { font-family:'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; margin:0; letter-spacing: -0.01em; }
  .status-line { font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.03em; margin-top:1px; display:flex; align-items:center; gap:5px;}
  .dot { width:7px; height:7px; border-radius:50%; background: var(--text-dim); flex-shrink:0; }
  .dot.loading, .dot.running { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse .8s infinite ease-in-out; }
  .dot.ready { background: var(--ok); }
  .dot.error { background: var(--err); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #overlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition: opacity .2s;
    z-index: 29;
  }
  #overlay.open { opacity:1; pointer-events:auto; }

  #sidebar {
    position: fixed; top:0; left:0; bottom:0;
    width: min(82vw, 300px);
    background: var(--panel);
    border-right: 1px solid var(--line);
    transform: translateX(-100%);
    transition: transform .22s ease;
    z-index: 30;
    display:flex; flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }
  #sidebar.open { transform: translateX(0); }

  .sidebar-head { padding: 16px 14px 12px; border-bottom: 1px solid var(--line); }
  .sidebar-head .label {
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
  }
  #newScriptBtn { margin-top: 10px; width:100%; justify-content:center; background: var(--panel-2); border:1px solid var(--line); color: var(--text); }

  #scriptList { flex:1; overflow-y:auto; padding: 8px; }
  .script-item {
    display:flex; align-items:center; gap:8px;
    padding: 10px 10px; border-radius: 8px;
    margin-bottom: 4px; cursor:pointer;
    border: 1px solid transparent;
  }
  .script-item.active { background: var(--panel-2); border-color: var(--amber-dim); }
  .script-item:active { background: var(--panel-2); }
  .script-item .meta { flex:1; min-width:0; }
  .script-item .name { font-size: 13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .script-item .snippet { font-size: 10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .del-btn { background:transparent; border:none; color: var(--text-dim); font-size: 15px; padding: 4px 6px; cursor:pointer; flex-shrink:0; }
  .del-btn:active { color: var(--err); }
  .empty-hint { padding: 20px 12px; color: var(--text-dim); font-size: 12px; line-height:1.6; }

  main { flex:1; display:flex; flex-direction:column; padding: 12px; gap: 10px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card-head {
    display:flex; align-items:center; justify-content:space-between;
    padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2);
    gap: 8px;
  }
  .card-head .label {
    font-family:'Space Grotesk', sans-serif; font-size: 11.5px; font-weight: 600;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  textarea {
    width:100%; display:block; background: transparent; color: var(--text);
    border: none; outline: none; resize: vertical;
    font-family:'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.55;
    padding: 12px; min-height: 42vh; tab-size: 4;
  }
  textarea::placeholder { color: #4a4738; }

  button {
    font-family:'Space Grotesk', sans-serif; font-weight: 600; font-size: 12.5px;
    border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text);
    padding: 9px 12px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition: border-color .15s, transform .05s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.ghost:hover { border-color: var(--amber-dim); }
  #fileInput { display:none; }

  .run-bar { display:flex; gap:10px; }
  #runBtn { flex:1; justify-content:center; background: var(--amber); color: #10130a; border: none; font-size: 14px; padding: 13px; }
  #runBtn:disabled { background: #3a3d24; color: #726e51; }

  #output {
    font-family:'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
    padding: 12px; white-space: pre-wrap; word-break: break-word;
    min-height: 100px; max-height: 30vh; overflow-y: auto;
  }
  #output .stderr { color: var(--err); }
  #output .placeholder { color: var(--text-dim); }

  .spinner {
    width:12px; height:12px; border-radius:50%;
    border: 2px solid rgba(0,0,0,0.25); border-top-color: #10130a;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { padding: 4px 16px 16px; text-align:center; font-size: 10px; color: var(--text-dim); letter-spacing: 0.03em; }

  #modalOverlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index: 40;
  }
  #modalOverlay.open { display:flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 0 0;
    width:100%; max-width: 480px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .modal .label { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; margin-bottom:10px; color: var(--text); }
  .modal input {
    width:100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 11px 12px; font-family:'JetBrains Mono', monospace; font-size: 14px;
    outline:none; margin-bottom: 12px;
  }
  .modal input:focus { border-color: var(--amber-dim); }
  .modal-actions { display:flex; gap: 8px; }
  .modal-actions button { flex:1; justify-content:center; }
  #modalSaveBtn { background: var(--amber); color:#10130a; border:none; }

  @media (min-width: 720px) {
    main { max-width: 760px; margin: 0 auto; width:100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="scripts">☰</button>
    <div class="brand-wrap">
      <h1>pyrun</h1>
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">waking up…</span></div>
    </div>
    <button class="icon-btn" id="uploadBtn" aria-label="upload">↑</button>
    <button class="icon-btn" id="saveBtn" aria-label="save">＋</button>
  </header>

  <div id="overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="label">saved scripts</div>
      <button id="newScriptBtn">＋ new script</button>
    </div>
    <div id="scriptList"></div>
  </aside>

  <main>
    <input type="file" id="fileInput" accept=".py,.txt" />

    <div class="card">
      <div class="card-head">
        <span class="label" id="currentName">untitled.py</span>
      </div>
      <textarea id="code" spellcheck="false" placeholder="paste python here, or tap ↑ to upload a .py file...

print(&quot;hello from your pocket&quot;)"></textarea>
    </div>

    <div class="run-bar">
      <button id="runBtn" disabled><span id="runBtnLabel">loading…</span></button>
      <button id="clearBtn" class="ghost">clear</button>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="label">output</span>
        <span class="label" id="timing"></span>
      </div>
      <div id="output"><span class="placeholder">run something — output shows up here.</span></div>
    </div>
  </main>

  <footer>runs fully in your browser · scripts saved to this app only</footer>
</div>

<div id="modalOverlay">
  <div class="modal">
    <div class="label">save script as</div>
    <input id="modalInput" type="text" placeholder="e.g. scrape_prices.py" autocomplete="off" />
    <div class="modal-actions">
      <button id="modalCancelBtn" class="ghost">cancel</button>
      <button id="modalSaveBtn">save</button>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const statusDot = $('statusDot'), statusText = $('statusText');
  const runBtn = $('runBtn'), runBtnLabel = $('runBtnLabel'), clearBtn = $('clearBtn');
  const codeEl = $('code'), outputEl = $('output'), timingEl = $('timing');
  const menuBtn = $('menuBtn'), sidebar = $('sidebar'), overlay = $('overlay');
  const newScriptBtn = $('newScriptBtn'), scriptListEl = $('scriptList');
  const uploadBtn = $('uploadBtn'), fileInput = $('fileInput');
  const saveBtn = $('saveBtn'), currentNameEl = $('currentName');
  const modalOverlay = $('modalOverlay'), modalInput = $('modalInput');
  const modalCancelBtn = $('modalCancelBtn'), modalSaveBtn = $('modalSaveBtn');

  let pyodide = null, ready = false, running = false;
  let scripts = [];
  let currentId = null;

  function setStatus(mode, text) {
    statusDot.className = 'dot ' + mode;
    statusText.textContent = text;
  }

  function writeOutput(text, isErr) {
    if (outputEl.querySelector('.placeholder')) outputEl.innerHTML = '';
    const span = document.createElement('span');
    if (isErr) span.className = 'stderr';
    span.textContent = text;
    outputEl.appendChild(span);
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  menuBtn.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  function openModal(defaultName) {
    modalInput.value = defaultName || '';
    modalOverlay.classList.add('open');
    setTimeout(() => modalInput.focus(), 50);
  }
  function closeModal() { modalOverlay.classList.remove('open'); }
  modalCancelBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  async function loadScripts() {
    scripts = [];
    try {
      const listRes = await window.storage.list('script:', false);
      const keys = (listRes && listRes.keys) || [];
      for (const key of keys) {
        try {
          const res = await window.storage.get(key, false);
          if (res && res.value) scripts.push(JSON.parse(res.value));
        } catch (e) { /* skip unreadable entry */ }
      }
      scripts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } catch (e) {
      // storage unavailable — sidebar just shows empty state
    }
    renderSidebar();
  }

  async function persistScript(script) {
    await window.storage.set('script:' + script.id, JSON.stringify(script), false);
  }
  async function deleteScriptStorage(id) {
    await window.storage.delete('script:' + id, false);
  }

  function renderSidebar() {
    scriptListEl.innerHTML = '';
    if (!scripts.length) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'no saved scripts yet — write something and tap ＋ to save it here.';
      scriptListEl.appendChild(hint);
      return;
    }
    scripts.forEach((s) => {
      const item = document.createElement('div');
      item.className = 'script-item' + (s.id === currentId ? ' active' : '');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('div');
      name.className = 'name'; name.textContent = s.name;
      const snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.textContent = (s.code || '').split('\n').find(l => l.trim()) || '(empty)';
      meta.appendChild(name); meta.appendChild(snippet);
      const del = document.createElement('button');
      del.className = 'del-btn'; del.textContent = '✕';
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        try { await deleteScriptStorage(s.id); } catch (err) {}
        scripts = scripts.filter(x => x.id !== s.id);
        if (currentId === s.id) { currentId = null; currentNameEl.textContent = 'untitled.py'; }
        renderSidebar();
      });
      item.appendChild(meta); item.appendChild(del);
      item.addEventListener('click', () => {
        codeEl.value = s.code;
        currentId = s.id;
        currentNameEl.textContent = s.name;
        closeSidebar();
        renderSidebar();
      });
      scriptListEl.appendChild(item);
    });
  }

  newScriptBtn.addEventListener('click', () => {
    codeEl.value = '';
    currentId = null;
    currentNameEl.textContent = 'untitled.py';
    closeSidebar();
    renderSidebar();
    codeEl.focus();
  });

  saveBtn.addEventListener('click', () => {
    const existing = scripts.find(s => s.id === currentId);
    openModal(existing ? existing.name : '');
  });

  modalSaveBtn.addEventListener('click', async () => {
    let name = modalInput.value.trim();
    if (!name) { modalInput.focus(); return; }
    if (!name.endsWith('.py')) name += '.py';
    const existing = scripts.find(s => s.id === currentId);
    const script = existing
      ? { ...existing, name, code: codeEl.value, updatedAt: Date.now() }
      : { id: 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), name, code: codeEl.value, updatedAt: Date.now() };
    try {
      await persistScript(script);
      currentId = script.id;
      currentNameEl.textContent = script.name;
      const idx = scripts.findIndex(s => s.id === script.id);
      if (idx >= 0) scripts[idx] = script; else scripts.unshift(script);
      renderSidebar();
      closeModal();
    } catch (e) {
      writeOutput('could not save script (storage error)\n', true);
      closeModal();
    }
  });

  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      codeEl.value = evt.target.result;
      currentId = null;
      currentNameEl.textContent = file.name;
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  clearBtn.addEventListener('click', () => {
    outputEl.innerHTML = '<span class="placeholder">run something — output shows up here.</span>';
    timingEl.textContent = '';
  });

  async function boot() {
    setStatus('loading', 'waking up…');
    try {
      pyodide = await loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/'
      });
      ready = true;
      runBtn.disabled = false;
      runBtnLabel.textContent = '▶ run';
      setStatus('ready', 'interpreter ready');
    } catch (err) {
      setStatus('error', 'failed to load: ' + (err && err.message ? err.message : err));
      runBtn.disabled = false;
      runBtnLabel.textContent = '↻ retry';
      runBtn.onclick_retry = true;
    }
  }
  boot();
  loadScripts();

  runBtn.addEventListener('click', async () => {
    if (!ready && !running) { boot(); return; }
    if (!ready || running) return;
    const code = codeEl.value;
    if (!code.trim()) { writeOutput('(nothing to run)\n', false); return; }
    running = true;
    runBtn.disabled = true;
    runBtnLabel.innerHTML = '<span class="spinner"></span> running';
    setStatus('running', 'executing…');
    outputEl.innerHTML = '';
    timingEl.textContent = '';
    const start = performance.now();
    try {
      pyodide.setStdout({ batched: (s) => writeOutput(s + '\n', false) });
      pyodide.setStderr({ batched: (s) => writeOutput(s + '\n', true) });
      await pyodide.loadPackagesFromImports(code);
      await pyodide.runPythonAsync(code);
      timingEl.textContent = Math.round(performance.now() - start) + 'ms';
      setStatus('ready', 'done · ready');
    } catch (err) {
      writeOutput(String(err), true);
      setStatus('ready', 'error · ready');
    } finally {
      running = false;
      runBtn.disabled = false;
      runBtnLabel.textContent = '▶ run';
    }
  });

  codeEl.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runBtn.click(); }
  });
</script>
</body>
</html>
