<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterglow — Quick Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A060D;
    --bg-1:#160C1E;
    --bg-2:#1F0F1A;
    --glass: rgba(255,255,255,0.045);
    --glass-hover: rgba(255,255,255,0.075);
    --border: rgba(255,255,255,0.09);
    --border-hover: rgba(230,180,150,0.55);
    --gold:#E3B27A;
    --gold-soft:#EFCFA0;
    --crimson:#FF4D6D;
    --text:#F5ECE4;
    --muted:#A896A3;
    --muted-2:#7C6C79;
    --radius:18px;
    --glow: 0 0 0 1px var(--border), 0 20px 50px rgba(0,0,0,0.55);
    --glow-hover: 0 0 0 1px var(--border-hover), 0 0 40px rgba(227,178,122,0.18), 0 24px 60px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--bg-0);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }

  .glow-field{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .glow-field span{
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.35;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .glow-field span:nth-child(1){
    width:520px; height:520px; left:-140px; top:-160px;
    background: radial-gradient(circle, rgba(255,77,109,0.55), transparent 70%);
  }
  .glow-field span:nth-child(2){
    width:460px; height:460px; right:-120px; top:120px;
    background: radial-gradient(circle, rgba(227,178,122,0.45), transparent 70%);
    animation-delay: -7s;
  }
  .glow-field span:nth-child(3){
    width:600px; height:600px; left:30%; bottom:-260px;
    background: radial-gradient(circle, rgba(140,80,190,0.4), transparent 70%);
    animation-delay: -14s;
  }
  @keyframes drift{
    from{ transform: translate(0,0) scale(1); }
    to{ transform: translate(30px,-30px) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .glow-field span{ animation:none; }
  }

  a{color:inherit;}
  main, header{ position:relative; z-index:1; }

  /* ---------- Header ---------- */
  header{
    padding: 34px 20px 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--gold);
    margin:0 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
    background: var(--crimson);
    box-shadow: 0 0 10px var(--crimson);
    display:inline-block;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size: clamp(34px, 7vw, 52px);
    margin: 0 0 6px;
    letter-spacing:0.01em;
    background: linear-gradient(120deg, #FFFFFF 0%, var(--gold-soft) 55%, var(--crimson) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color: var(--muted);
    font-size:14.5px;
    margin:0 0 22px;
  }

  .search-wrap{
    position:relative;
    display:flex;
    align-items:center;
    background: var(--glass);
    border:1px solid var(--border);
    border-radius: 14px;
    padding: 0 16px;
    backdrop-filter: blur(14px);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search-wrap:focus-within{
    border-color: var(--border-hover);
    box-shadow: 0 0 0 4px rgba(227,178,122,0.08);
  }
  .search-wrap svg{ flex:0 0 auto; opacity:0.5; }
  #search{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:13px 10px;
  }
  #search::placeholder{ color: var(--muted-2); }
  .count-pill{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--bg-0);
    background: linear-gradient(120deg, var(--gold), var(--crimson));
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
    font-weight:600;
  }

  /* ---------- Grid ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding: 8px 20px 20px;
  }
  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  @media (max-width: 480px){
    #grid{ grid-template-columns: 1fr; }
  }

  .card{
    position:relative;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--text);
    border-radius: var(--radius);
    padding: 18px 16px 14px;
    cursor:pointer;
    box-shadow: var(--glow);
    border: 1px solid var(--border);
    opacity:0;
    transform: translateY(10px);
    animation: rise .5s ease forwards;
    transition: transform .2s ease, box-shadow .25s ease, border-color .25s ease, background .2s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow: var(--glow-hover);
    border-color: var(--border-hover);
    background: var(--glass-hover);
  }
  .card:active{ transform: translateY(-1px) scale(0.99); }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .card, .fab, .modal-card{ transition:none !important; }
  }

  .card-head{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:12px;
  }
  .favicon{
    width:32px; height:32px;
    border-radius:50%;
    flex:0 0 auto;
    background: linear-gradient(135deg, var(--gold), var(--crimson));
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:15px;
    color: var(--bg-0);
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 4px 14px rgba(227,178,122,0.25);
  }
  .favicon img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }

  .card-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.25;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    color:var(--text);
  }

  .card-url{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin: 0 0 16px;
  }

  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top: 1px solid var(--border);
    padding-top:11px;
  }
  .open-link{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.03em;
    color: var(--gold-soft);
    text-decoration:none;
    transition: color .15s ease;
  }
  .open-link:hover{ color: var(--crimson); }
  .card-actions{ display:flex; gap:2px; }
  .icon-btn{
    width:30px; height:30px;
    border-radius:9px;
    border:none;
    background:transparent;
    color: var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background .12s ease, color .12s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.08); color: var(--gold-soft); }
  .icon-btn.danger:hover{ background: rgba(255,77,109,0.14); color: var(--crimson); }

  /* ---------- Empty state ---------- */
  #empty{
    display:none;
    text-align:center;
    padding: 70px 20px;
    color: var(--muted);
  }
  #empty h2{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    color: var(--text);
    font-size:26px;
    margin-bottom:8px;
  }
  #empty p{ font-size:14px; margin:0 0 20px; }
  #empty button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    background: linear-gradient(120deg, var(--gold), var(--crimson));
    color: var(--bg-0);
    border:none;
    padding:11px 20px;
    border-radius:12px;
    cursor:pointer;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width:60px; height:60px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--gold), var(--crimson));
    color: var(--bg-0);
    border:none;
    box-shadow: 0 10px 30px rgba(255,77,109,0.35), 0 0 0 1px rgba(255,255,255,0.15);
    font-size:28px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:20;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .fab:hover{ transform: scale(1.06); box-shadow: 0 12px 36px rgba(255,77,109,0.5), 0 0 0 1px rgba(255,255,255,0.2); }
  .fab:active{ transform: scale(0.95); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(5,3,7,0.7);
    backdrop-filter: blur(6px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{ display:flex; }
  .modal-card{
    width:100%;
    max-width:440px;
    background: linear-gradient(180deg, #1B1020 0%, #150B18 100%);
    color: var(--text);
    border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    border: 1px solid var(--border);
    border-bottom:none;
    transform: translateY(100%);
    animation: sheet-up .3s ease forwards;
  }
  @keyframes sheet-up{ to{ transform: translateY(0); } }

  @media (min-width: 560px){
    .overlay{ align-items:center; }
    .modal-card{
      border-radius: var(--radius);
      border-bottom: 1px solid var(--border);
      transform: translateY(12px) scale(0.98);
      opacity:0;
      animation: modal-in .22s ease forwards;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    @keyframes modal-in{ to{ transform:none; opacity:1; } }
  }

  .modal-tab{
    width:36px; height:5px;
    background: rgba(255,255,255,0.15);
    border-radius:3px;
    margin: 0 auto 16px;
  }
  @media (min-width:560px){ .modal-tab{ display:none; } }

  .modal-card h3{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:23px;
    margin:0 0 18px;
    color: var(--gold-soft);
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-family:'JetBrains Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color: var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:12px 13px;
    border-radius:11px;
    border:1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    outline:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: var(--muted-2); }
  .field input:focus{ border-color: var(--gold); background: rgba(255,255,255,0.07); }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition: filter .15s ease, background .15s ease;
  }
  .btn-primary{ background: linear-gradient(120deg, var(--gold), var(--crimson)); color: var(--bg-0); }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{ background: transparent; color: var(--muted); border:1px solid var(--border); }
  .btn-ghost:hover{ background: rgba(255,255,255,0.06); color: var(--text); }

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, .card:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* toast */
  #toast{
    position:fixed;
    left:50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: linear-gradient(120deg, #201322, #170D1B);
    color: var(--text);
    font-size:13.5px;
    font-weight:600;
    padding:11px 18px;
    border-radius:12px;
    border:1px solid var(--border-hover);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index:40;
  }
  #toast.show{ opacity:1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="glow-field"><span></span><span></span><span></span></div>

<header>
  <p class="eyebrow">Quick launch</p>
  <h1>Afterglow</h1>
  <p class="sub">Your favorite tabs, one tap away.</p>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="search" type="text" placeholder="Search your links…" autocomplete="off">
    <span class="count-pill" id="count">0</span>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div id="empty">
    <h2>Nothing saved yet</h2>
    <p>Add your first link to light things up.</p>
    <button id="emptyAdd">Add a link</button>
  </div>
</main>

<button class="fab" id="fabAdd" aria-label="Add a new link">+</button>

<div class="overlay" id="overlay">
  <div class="modal-card">
    <div class="modal-tab"></div>
    <h3 id="modalTitle">New link</h3>
    <form id="cardForm">
      <div class="field">
        <label for="titleInput">Title</label>
        <input id="titleInput" type="text" placeholder="e.g. Spring Boot Docs" required>
      </div>
      <div class="field">
        <label for="urlInput">URL</label>
        <input id="urlInput" type="text" placeholder="e.g. docs.spring.io" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save link</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'cardCatalog.links';
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty');
  const searchInput = document.getElementById('search');
  const countPill = document.getElementById('count');
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('cardForm');
  const titleInput = document.getElementById('titleInput');
  const urlInput = document.getElementById('urlInput');
  const modalTitle = document.getElementById('modalTitle');
  const saveBtn = document.getElementById('saveBtn');
  const toast = document.getElementById('toast');

  let links = loadLinks();
  let editingId = null;
  let toastTimer = null;

  function loadLinks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function saveLinks(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(links)); }
    catch(e){ showToast('Could not save — storage unavailable'); }
  }

  function normalizeUrl(raw){
    let v = raw.trim();
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function hostOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ return url; }
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = links.filter(l =>
      l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)
    );

    grid.innerHTML = '';
    countPill.textContent = links.length;

    if(links.length === 0){
      emptyState.style.display = 'block';
      grid.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    grid.style.display = 'grid';

    filtered.forEach((link, i) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.animationDelay = (i * 0.03) + 's';
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', 'Open ' + link.title);

      const host = hostOf(link.url);
      const initial = link.title.trim().charAt(0).toUpperCase() || '?';

      card.innerHTML = `
        <div class="card-head">
          <span class="favicon" data-initial="${initial}">
            <img src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}" alt="" loading="lazy">
          </span>
          <h3 class="card-title">${escapeHtml(link.title)}</h3>
        </div>
        <p class="card-url">${escapeHtml(host)}</p>
        <div class="card-foot">
          <a class="open-link" href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a>
          <div class="card-actions">
            <button class="icon-btn" data-action="copy" aria-label="Copy link for ${escapeAttr(link.title)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button class="icon-btn" data-action="edit" aria-label="Edit ${escapeAttr(link.title)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button class="icon-btn danger" data-action="delete" aria-label="Delete ${escapeAttr(link.title)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
            </button>
          </div>
        </div>
      `;

      const img = card.querySelector('.favicon img');
      img.addEventListener('error', () => {
        const fav = card.querySelector('.favicon');
        fav.removeChild(img);
        fav.textContent = initial;
      });

      card.addEventListener('click', (e) => {
        if(e.target.closest('[data-action]')) return;
        if(e.target.closest('.open-link')) return;
        window.open(link.url, '_blank', 'noopener,noreferrer');
      });
      card.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.target.closest('[data-action]')){
          window.open(link.url, '_blank', 'noopener,noreferrer');
        }
      });

      card.querySelector('[data-action="copy"]').addEventListener('click', (e) => {
        e.stopPropagation();
        copyLink(link.url);
      });
      card.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
        e.stopPropagation();
        openModal(link);
      });
      card.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteLink(link.id);
      });

      grid.appendChild(card);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  function copyLink(url){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(() => showToast('Link copied — paste it in an incognito window'))
        .catch(() => fallbackCopy(url));
    }else{
      fallbackCopy(url);
    }
  }

  function fallbackCopy(url){
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      showToast('Link copied — paste it in an incognito window');
    }catch(e){
      showToast('Could not copy — long-press the URL to copy it');
    }
    document.body.removeChild(ta);
  }

  function openModal(link){
    editingId = link ? link.id : null;
    modalTitle.textContent = link ? 'Edit link' : 'New link';
    saveBtn.textContent = link ? 'Save changes' : 'Save link';
    titleInput.value = link ? link.title : '';
    urlInput.value = link ? link.url : '';
    overlay.classList.add('open');
    setTimeout(() => titleInput.focus(), 50);
  }

  function closeModal(){
    overlay.classList.remove('open');
    form.reset();
    editingId = null;
  }

  function deleteLink(id){
    const link = links.find(l => l.id === id);
    links = links.filter(l => l.id !== id);
    saveLinks();
    render();
    showToast('Removed "' + (link ? link.title : 'link') + '"');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    const url = normalizeUrl(urlInput.value);
    if(!title || !urlInput.value.trim()) return;

    if(editingId){
      const link = links.find(l => l.id === editingId);
      link.title = title;
      link.url = url;
      showToast('Link updated');
    }else{
      links.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), title, url });
      showToast('Link saved');
    }
    saveLinks();
    render();
    closeModal();
  });

  document.getElementById('fabAdd').addEventListener('click', () => openModal(null));
  document.getElementById('emptyAdd').addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  searchInput.addEventListener('input', render);

  render();
})();
</script>

</body>
</html>
